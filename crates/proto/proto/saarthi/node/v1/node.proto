// The daemon-facing API. A node holds one Link stream open to the hub and reconnects with
// backoff; its pre-shared token goes in the `authorization` metadata as `Bearer <token>`.
syntax = "proto3";

package saarthi.node.v1;

import "saarthi/event/v1/event.proto";

service NodeService {
  rpc Link(stream NodeMessage) returns (stream HubMessage);
  // The Claude token a session started at the node's terminal runs under (ADR-0046): the
  // named one, or without a name the node's default; none for the node's own login.
  rpc ClaudeToken(ClaudeTokenRequest) returns (ClaudeTokenReply);
  // A Claude API request of a session under one of the hub's tokens (ADR-0051): the hub
  // adds the token and relays it to Anthropic, streaming the answer back.
  rpc ClaudeApi(stream ClaudeApiRequest) returns (stream ClaudeApiResponse);
}

// The request head in the first message only; the body in pieces of at most 1 MB.
message ClaudeApiRequest {
  ClaudeApiHead head = 1;
  bytes body = 2;
}

message ClaudeApiHead {
  string claude_token = 1;           // the name of the hub's token to run under
  string method = 2;
  string path = 3;                   // with its query; only /v1/ is relayed
  repeated HttpHeader headers = 4;
}

// The response head in the first message only; then the body as it arrives.
message ClaudeApiResponse {
  ClaudeApiStatus head = 1;
  bytes body = 2;
}

message ClaudeApiStatus {
  uint32 status = 1;
  repeated HttpHeader headers = 2;
}

message HttpHeader {
  string name = 1;
  bytes value = 2;
}

message ClaudeTokenRequest {
  optional string name = 1;  // unset: the node's default
}

message ClaudeTokenReply {
  ClaudeToken claude_token = 1;  // unset: the node's own login
}

message NodeMessage {
  oneof body {
    Register register = 1;      // always the first message on a stream
    saarthi.event.v1.Session session = 2;  // a session appeared or changed
    saarthi.event.v1.Event event = 3;
    saarthi.event.v1.PendingRequest pending = 4;
    saarthi.event.v1.PendingClosed pending_closed = 5;
    saarthi.event.v1.HealthSample health = 6;
    CommandResult command_result = 7;
  }
}

message Register {
  string name = 1;
  string version = 2;
  repeated saarthi.event.v1.Session sessions = 3;          // live at connect time
  repeated saarthi.event.v1.PendingRequest pending = 4;    // still held at connect time
  // Directories a session may be spawned under (`--spawn-root`); none means spawning is off.
  repeated string spawn_roots = 5;
  // The launch profiles a spawn may name, besides the host.
  repeated saarthi.event.v1.LaunchProfile profiles = 6;
}

message HubMessage {
  oneof body {
    Registered registered = 1;
    Ack ack = 2;
    Command command = 3;
  }
}

message Registered {
  string node_id = 1;
  // The highest event seq the hub has stored for this node. The node resends everything
  // after it from its buffer, then continues live.
  uint64 last_seq = 2;
}

// The hub has stored every event up to and including seq; the node may drop them.
message Ack {
  uint64 seq = 1;
}

message Command {
  string id = 1;
  string session_id = 2;
  oneof action {
    saarthi.event.v1.Resolution resolve = 3;
    Prompt prompt = 4;
    Interrupt interrupt = 5;
    Kill kill = 6;
    Spawn spawn = 7;
    SetKeepAwake set_keep_awake = 8;
    Resume resume = 9;
    Probe probe = 10;
  }
}

// Delivered over the session's messaging socket; works for bare and wrapped sessions.
message Prompt {
  string text = 1;
}

// Wrapped and spawned sessions. A follow-up prompt, if any, is sent after the interrupt.
message Interrupt {
  optional string then_prompt = 1;
}

// Ends the session's process: through its wrapper, by closing a spawned session's input,
// or by SIGTERM to a bare session's pid.
message Kill {}

// Starts a headless session (ADR-0034) under the command's session_id, which the node
// passes to claude as --session-id. Node-level: no session exists yet.
message Spawn {
  string cwd = 1;               // must lie under one of the node's spawn roots
  string prompt = 2;            // the first turn; empty to start idle, waiting for one
  string model = 3;             // empty for claude's default
  bool create = 4;              // make cwd, and its missing parents, if it does not exist
  // claude's --permission-mode, such as acceptEdits, plan or bypassPermissions; empty for
  // the user's default. The node refuses a value claude does not list.
  string permission_mode = 5;
  // A launch profile the node's profiles file names, such as a seatbelt sandbox (ADR-0038);
  // empty to run on the host. The node refuses a name it does not have.
  string profile = 6;
  // The Claude token to run under, chosen by the hub (ADR-0039); absent for the node's own
  // login. Its name only: the node relays the session's API requests through `ClaudeApi`
  // (ADR-0051).
  ClaudeToken claude_token = 7;
}

// A named `claude setup-token` token. Since ADR-0051 the hub sends the name only and
// `token` is always empty: the value never leaves the hub.
message ClaudeToken {
  string name = 1;
  string token = 2;
}

// Continues the finished session named by the command's session_id headless, in place
// (ADR-0036, EXP-20261106-62st4b): same id, same transcript, its directory under a spawn
// root.
message Resume {
  string cwd = 1;               // the session's directory, from the hub's record
  string prompt = 2;            // the next turn; empty to resume idle
  string model = 3;             // empty for claude's default
  ClaudeToken claude_token = 4; // as for Spawn
}

// Node-level: one throwaway Haiku turn under a Claude token, for the account's rate-limit
// windows (ADR-0043): in an empty config directory under a temporary directory, never
// listed as a session, everything removed afterwards. The command's session_id is empty;
// the result carries the turn's rate_limit_info in probe_json. Refused by a node that does
// not run headless sessions (no spawn roots).
message Probe {
  ClaudeToken claude_token = 1;
}

// Node-level: turns the keep-awake hold (ADR-0031) on or off; the command's session_id is
// empty.
message SetKeepAwake {
  bool on = 1;
}

message CommandResult {
  string command_id = 1;
  bool ok = 2;
  string error = 3;             // why it was refused, shown to the person as is
  string note = 4;              // a caveat on a command carried out, such as a prompt held
                                // for approval at the terminal; shown as is
  string probe_json = 5;        // Probe only: the turn's rate_limit_info, as claude streamed it
}
