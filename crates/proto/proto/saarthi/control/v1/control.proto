// The client-facing API: the hub's view across every node. Clients present their
// pre-shared token in the `authorization` metadata as `Bearer <token>`.
syntax = "proto3";

package saarthi.control.v1;

import "saarthi/event/v1/event.proto";

service ControlService {
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ListPending(ListPendingRequest) returns (ListPendingResponse);
  // Changes to nodes, sessions and pending requests, live, after the lists above.
  rpc Watch(WatchRequest) returns (stream Update);
  // A session's events after a seq, stored ones first, then live until the client cancels.
  rpc StreamSession(StreamSessionRequest) returns (stream saarthi.event.v1.Event);
  rpc GetHealth(GetHealthRequest) returns (GetHealthResponse);

  rpc Resolve(ResolveRequest) returns (CommandResponse);
  rpc Prompt(PromptRequest) returns (CommandResponse);
  rpc Interrupt(InterruptRequest) returns (CommandResponse);
  // Ends any session's process (ADR-0034).
  rpc Kill(KillRequest) returns (CommandResponse);
  // Starts a headless session on a node; the response carries its id.
  rpc Spawn(SpawnRequest) returns (CommandResponse);
  // Continues a finished session headless, in place (ADR-0036).
  rpc Resume(ResumeRequest) returns (CommandResponse);
  // Sessions newest first, live and ended, with what a list of them shows: the opening
  // user lines and the latest usage totals, as stored (ADR-0036).
  rpc History(HistoryRequest) returns (HistoryResponse);
  // Turns a node's keep-awake hold on or off.
  rpc SetKeepAwake(SetKeepAwakeRequest) returns (CommandResponse);

  // The named Claude tokens the hub holds (ADR-0039), by name, with their dates and the
  // latest usage seen under each; never their values.
  rpc ListClaudeTokens(ListClaudeTokensRequest) returns (ListClaudeTokensResponse);
  // Sets or clears a token's expiry by hand.
  rpc SetClaudeTokenExpiry(SetClaudeTokenExpiryRequest) returns (ListClaudeTokensResponse);
  // Sets or clears the token a node's spawned sessions run under when none is picked.
  rpc SetDefaultClaudeToken(SetDefaultClaudeTokenRequest) returns (SetDefaultClaudeTokenResponse);

  // Adds (or with `unregister`, removes) a UnifiedPush endpoint the hub posts notifications
  // to: a JSON object per held request or finished turn (ADR-0026).
  rpc RegisterPush(RegisterPushRequest) returns (RegisterPushResponse);
}

message Node {
  string id = 1;
  string name = 2;
  string version = 3;
  bool connected = 4;
  int64 last_seen_ms = 5;
  // Where a session may be spawned, as the node last registered them; empty when the node
  // does not allow spawning or is not connected.
  repeated string spawn_roots = 6;
  // The launch profiles a spawn may name, besides the host, as the node last registered them.
  repeated saarthi.event.v1.LaunchProfile profiles = 7;
  // The Claude token its spawned sessions run under when none is picked; empty for the
  // node's own login.
  string default_claude_token = 8;
  // The tailnet the node's link last came over, by the hub's name for it; empty for plain
  // TCP (ADR-0048).
  string tailnet = 9;
  // Who that tailnet said the caller was, `host (login)`. Recorded, not checked.
  string tailnet_peer = 10;
}

message ListNodesRequest {}

message ListNodesResponse {
  repeated Node nodes = 1;
}

message ListSessionsRequest {
  string node_id = 1;           // empty for every node
  bool include_ended = 2;
}

message ListSessionsResponse {
  repeated saarthi.event.v1.Session sessions = 1;
}

message ListPendingRequest {}

message ListPendingResponse {
  repeated PendingOnNode pending = 1;
}

message PendingOnNode {
  string node_id = 1;
  saarthi.event.v1.PendingRequest request = 2;
}

message WatchRequest {}

message Update {
  oneof body {
    Node node = 1;
    saarthi.event.v1.Session session = 2;
    PendingOnNode pending = 3;
    PendingClosedOnNode pending_closed = 4;
  }
}

message PendingClosedOnNode {
  string node_id = 1;
  saarthi.event.v1.PendingClosed closed = 2;
}

message StreamSessionRequest {
  string node_id = 1;
  string session_id = 2;
  uint64 after_seq = 3;
}

message GetHealthRequest {
  string node_id = 1;
  int64 since_ms = 2;
}

message GetHealthResponse {
  repeated saarthi.event.v1.HealthSample samples = 1;
}

message ResolveRequest {
  string node_id = 1;
  saarthi.event.v1.Resolution resolution = 2;
}

message PromptRequest {
  string node_id = 1;
  string session_id = 2;
  string text = 3;
}

message InterruptRequest {
  string node_id = 1;
  string session_id = 2;
  optional string then_prompt = 3;
}

message KillRequest {
  string node_id = 1;
  string session_id = 2;
}

message SpawnRequest {
  string node_id = 1;
  string cwd = 2;
  string prompt = 3;            // empty to start idle, waiting for a prompt
  string model = 4;             // empty for claude's default
  bool create = 5;              // make cwd under the spawn root if it does not exist
  string permission_mode = 6;   // claude's --permission-mode; empty for the user's default
  string profile = 7;           // the node's launch profile (ADR-0038); empty for the host
  // The named Claude token to run under (ADR-0039): absent for the node's default, empty for
  // the node's own login.
  optional string claude_token = 8;
}

message ResumeRequest {
  string node_id = 1;
  string session_id = 2;
  string prompt = 3;            // empty to resume idle
  string model = 4;             // empty for claude's default
  // As for Spawn, except that absent means the token the session last ran under.
  optional string claude_token = 5;
}

message HistoryRequest {
  string node_id = 1;           // empty for every node
  int64 before_ms = 2;          // sessions started before this; 0 for now
  uint32 limit = 3;             // at most this many; 0 for 50
}

message HistoryResponse {
  repeated SessionHistory sessions = 1;
}

message SessionHistory {
  saarthi.event.v1.Session session = 1;
  // The session's first few transcript `user` lines, for its first prompt.
  repeated saarthi.event.v1.Event opening = 2;
  // The daemon's latest usage totals by model, as its `usage` events carry them; empty
  // when none were counted.
  string usage_json = 3;
}

message SetKeepAwakeRequest {
  string node_id = 1;
  bool on = 2;
}

message ClaudeToken {
  string name = 1;
  int64 first_seen_ms = 2;      // when the hub first read this token under this name
  int64 expires_ms = 3;         // the hand-set expiry, else a year after first seen
  bool expiry_set = 4;          // whether expires_ms was set by hand
  // The account's windows as last reported by a session under this token, from its
  // rate_limit_event (ADR-0042); usage_ms 0 when none has been seen.
  int64 usage_ms = 5;
  optional double five_hour_pct = 6;
  optional int64 five_hour_resets_s = 7;
  optional double seven_day_pct = 8;
  optional int64 seven_day_resets_s = 9;
}

message ListClaudeTokensRequest {}

message ListClaudeTokensResponse {
  repeated ClaudeToken tokens = 1;
}

message SetClaudeTokenExpiryRequest {
  string name = 1;
  int64 expires_ms = 2;         // 0 to clear: a year after first seen again
}

message SetDefaultClaudeTokenRequest {
  string node_id = 1;
  string name = 2;              // empty for the node's own login
}

message SetDefaultClaudeTokenResponse {}

message RegisterPushRequest {
  string endpoint = 1;
  bool unregister = 2;
}

message RegisterPushResponse {}

// The node's CommandResult, passed through once the node has acted on the command.
message CommandResponse {
  bool ok = 1;
  string error = 2;
  string note = 3;
  string session_id = 4;        // Spawn only: the new session's id
}
