[package]
name = "saarthi-node"
version.workspace = true
edition.workspace = true

[[bin]]
name = "saarthi"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
glob = "0.3.1"
bytes = "1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
hex = "0.4.3"
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
sha2 = "0.10.9"
libc = "0.2.191"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
saarthi-proto = { version = "0.21.0", path = "../proto" }
saarthi-tailnet = { version = "0.21.0", path = "../tailnet" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "fs", "io-util", "io-std", "process"] }
tokio-stream = "0.1.19"
toml = "1.1.8"
tonic = "0.14.6"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# The files viewer and changes view a session's changes are served with (ADR-0067),
# pinned with yajna's commit; its routes change only with this in step.
yajna-serve = { git = "https://github.com/leoank/yajna", rev = "9712852e8e490208f9bac0a4448adfc89344fd53" }
uuid = { version = "1.28.0", features = ["v4"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
qrcode = { version = "0.14.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
io-kit-sys = "0.5.0"
mxc-sdk = "1.0.0"

[dev-dependencies]
tempfile = "3.27.0"
