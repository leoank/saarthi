[package]
name = "service-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
prost = "0.14.4"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tonic-prost = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14.6"

[workspace]
