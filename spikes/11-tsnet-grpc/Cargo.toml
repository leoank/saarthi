[package]
name = "tsnet-grpc"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1.0.104"
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc = "0.2.191"
prost = "0.14.4"
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "time", "process"] }
tokio-stream = "0.1.19"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[workspace]
